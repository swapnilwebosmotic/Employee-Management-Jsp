<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2 class="page-title">Employee</h2>
  <div class="container">
    <!-- Employee Form -->
    <section class="form-section">
      <div class="panel">
        <div class="panel-heading">Add Employee</div>
        <div class="panel-body">
          <form id="employeeForm">
            <input type="hidden" id="editIndex" />

            <!-- Name -->
            <div class="form-row reverse">
              <label for="name">Name:</label>
              <div class="input-wrapper">
                <input type="text" id="name" placeholder="Enter name" />
                <span id="nameError" class="error"></span>
              </div>
            </div>

            <!-- Gender -->
            <div class="form-row reverse">
              <label>Gender:</label>
              <div class="input-wrapper">
                <div class="inline-options">
                  <label><input type="radio" name="gender" value="Male" checked /> Male</label>
                  <label><input type="radio" name="gender" value="Female" /> Female</label>
                </div>
                <span id="genderError" class="error"></span>
              </div>
            </div>

            <!-- DOB -->
            <div class="form-row reverse">
              <label for="dob">Date of birth:</label>
              <div class="input-wrapper">
                <input type="date" id="dob" placeholder="mm/dd/yyyy" />
                <span id="dobError" class="error"></span>
              </div>
            </div>

            <!-- Email -->
            <div class="form-row reverse">
              <label for="email">Email:</label>
              <div class="input-wrapper">
                <input type="email" id="email" placeholder="Enter email" />
                <span id="emailError" class="error"></span>
              </div>
            </div>

            <!-- Phone -->
            <div class="form-row reverse">
              <label for="phone">Phone:</label>
              <div class="input-wrapper">
                <input type="text" id="phone" placeholder="Enter phone" />
                <span id="phoneError" class="error"></span>
              </div>
            </div>

            <!-- Hobbies -->
            <div class="form-row hobbies">
              <label for="hobbies">Hobbies:</label>
              <div class="inline-options">
                <label><input type="checkbox" name="hobbies" value="Cricket" /> Cricket</label>
                <label><input type="checkbox" name="hobbies" value="Chess" /> Chess</label>
                <label><input type="checkbox" name="hobbies" value="Music" /> Music</label>
              </div>
            </div>

            <!-- Submit -->
            <div class="form-actions">
              <button type="submit" class="btn-submit">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- Basic Table -->
    <h3 class="section-title">Basic</h3>
    <div class="panel">
      <div class="panel-heading">Display</div>
      <div class="panel-body">
        <table id="employeeTableBasic">
          <thead>
            <tr>
              <th>Name</th>
              <th>Gender</th>
              <th>DOB</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Hobbies</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Advanced Table -->
    <h3 class="section-title">Advanced</h3>
    <div class="panel">
      <div class="panel-heading">Display</div>
      <div class="panel-body">
        <table id="employeeTableAdvanced">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="Employee.js"></script>
</body>
</html>
