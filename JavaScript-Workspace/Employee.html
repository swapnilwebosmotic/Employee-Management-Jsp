<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Employee</h2>

    <div class="form-container">
        <div class="form-header">Add Employee</div>
            <form id="employeeForm">
                <label for="name">Name: <span>*</span></label>
                <input type="text" id="name" name="name" required>
                <label>Gender <span>*</span></label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="Male" checked required> Male</label>
                    <label><input type="radio" name="gender" value="Female" required> Female</label>
                </div>
                <label for="dob">Date of Birth: <span>*</span></label>
                <input type="date" id="dob" name="dob" required>
                <label for="email">Email: <span>*</span></label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" pattern="\d{10}" maxlength="10">
                <div class="hobbies-group">
                    <label for="hobbies">Hobbies:</label>
                    <div class="hobbies">
                        <label><input type="checkbox" name="hobbies" value="Cricket"> Cricket</label>
                        <label><input type="checkbox" name="hobbies" value="Chess"> Chess</label>
                        <label><input type="checkbox" name="hobbies" value="Music"> Music</label>
                    </div>
                </div>

                <button type="submit">Submit</button>
            </form>
       
    </div>

    <!-- Tables -->
    <h2>Basic</h2>
    <div class="table-container">
        <div class="table-header">Display</div>
        <table id="basicTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>DOB</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Hobbies</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h2>Advanced</h2>
    <div class="table-container">
        <div class="table-header">Display</div>
        <table id="advancedTable">
            <tbody></tbody>
        </table>
    </div>

    <script src="Employee.js"></script>
</body>

</html>
